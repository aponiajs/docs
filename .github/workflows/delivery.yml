name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: delivery-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Cloudflare Pages production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate production site URL
        run: bun scripts/require-site-url.mjs

      - name: Lint
        run: bun run lint

      - name: Check types
        run: bun run types:check

      - name: Build static Pages application
        run: bun run build

      - name: Check SEO and AI discovery output
        run: bun run seo:check

      - name: Verify Pages output
        run: |
          test -f out/index.html
          test -f out/_headers
          test -f out/robots.txt
          test -f out/sitemap.xml
          test -f out/llms.txt
          test -f out/llms-full.txt

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: aponiajs-docs-pages-${{ github.sha }}
          path: out
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '4.114.0'
          command: pages deploy out --project-name=docs --branch=main
